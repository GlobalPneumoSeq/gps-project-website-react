name: Deploy on Push

on:
  push:
    branches:
      - gh-pages-source

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
        - name: Checkout repository
          uses: actions/checkout@v7

        - name: Install pnpm
          uses: pnpm/setup@v3
          with:
            version: 12
            runtime: node@22
            cache: true

        - name: Install dependencies
          run: pnpm install

        - name: Build website
          run: pnpm build

        - name: Deploy website to staging
          uses: peaceiris/actions-gh-pages@v4
          with:
            github_token: ${{ secrets.GITHUB_TOKEN }}
            publish_dir: ./gps-project-website-react
